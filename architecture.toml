# Breaks of the role and layer rules (CONTRIBUTING.md, "Roles", "Layout"), checked by checks/tests/architecture.rs.
#
# Readers read, writers write, and everything listed here is a break to remove: each gives its reason and what
# removes it (`removed_when`). The test fails on a violation not listed here, on an entry that no longer occurs, and on
# any entry it hasn't seen before (`breaks_only_go`): fixing a violation means deleting its entry, never adding one.
# Disk access is a rule by crate role, not a list: only `exception` I/O is listed. `parse_crate` is an opt-in to a
# stricter rule, not a break.

# ---- crate dependencies ----

# ---- game, engine and destination names: none in core, toolkit and formats; a worlds crate only its own ----

# ---- worlds crate layout: modules not yet arranged by role (read/, passes/, write/, components/, stages) ----
# A migration status per module, counted like a break: the check fails on a module that breaks the layout and isn't
# listed, and on a listed one that follows it now. Each entry goes with the commit that arranges its module.

# ---- composition without data logic (examples, bins) ----

# ---- passes registered, lowerings run as passes ----

# ---- writers take the world read-only ----

# ---- file, environment and process access (clippy.toml), by module role ----

# ---- parse modules: decoding bytes, unchecked arithmetic and indexing denied ----

