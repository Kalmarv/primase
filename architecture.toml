# Breaks of the role and layer rules (CONTRIBUTING.md, "Roles", "Layout"), checked by cli/tests/architecture.rs.
#
# Readers read, writers write, and everything listed here is a break to remove: each gives its reason and what
# removes it (`removed_when`). The test fails on a violation not listed here, on an entry that no longer occurs, and on
# any entry it hasn't seen before (`breaks_only_go`): fixing a violation means deleting its entry, never adding one.
# Disk access is a rule by crate role, not a list: only `exception` I/O is listed. `parse_crate` is an opt-in to a
# stricter rule, not a break.

# ---- crate dependencies ----

[[dependency]]
from = "worlds/fromsoft"
to = "worlds/reskate"
section = "dependencies"
reason = "the Sekiro area reader still attaches skate.* components and skate scene policy"
removed_when = "the reader attaches core and fromsoft.* only, and skate shaping runs as passes"

[[dependency]]
from = "worlds/reskate"
to = "formats/gltf"
section = "dependencies"
reason = "the ReSkate writer and its post-compile step re-read prototype GLBs"
removed_when = "meshes reach the writer as core.mesh through the reader's load step"

# ---- game, engine and destination names: none in core, toolkit and formats; a worlds crate only its own ----

[[name]]
crate = "toolkit/hash"
word = "fromsoft"
reason = "fromsoft_path, one game's path hash framing"
removed_when = "it moves into worlds/fromsoft, its only user"

[[name]]
crate = "toolkit/hash"
word = "forza"
reason = "forza_string, a hash with no user yet"
removed_when = "it moves into the Forza reader when one exists, or is deleted"

[[name]]
crate = "worlds/fromsoft"
word = "skate"
reason = "the Sekiro area reader builds skate.* components (materials, collision, markers, lights, grind curves)"
removed_when = "the FromSoft reader keeps source data and its passes give core data (plan steps 11-12)"

[[name]]
crate = "worlds/gta"
word = "skate"
reason = "the IPL defaults are the earlier skate exporter's, named in their report"
removed_when = "the exporter's IPL profile moves to the GTA program (plan step 14)"

[[name]]
crate = "worlds/reskate"
word = "gta"
reason = "the overlay pieces record carries GTA's own fields (centre, drawable, shader, bucket)"
removed_when = "overlay preparation leaves the writer and GTA's fields go to the GTA program's report (plan step 8)"

# ---- composition without data logic (examples, bins, cli) ----

[[entry_point]]
file = "cli/examples/scene_to_tiles.rs"
what = "queries or edits world components"
reason = "turns skate.* markers and grind curves into viewer items, and measures placements for the spanning rule"
removed_when = "primase convert replaces the example (the rule moves into primase-web, the lowering into a pass)"

[[entry_point]]
file = "cli/examples/scene_to_tiles.rs"
what = "runs a pass outside the pass manager"
reason = "runs lower-skate-pbr and lower-skate-lights directly"
removed_when = "primase convert replaces the example"

[[entry_point]]
file = "formats/web/examples/ktx2_audit.rs"
what = "reads a format itself"
reason = "an audit tool decoding written KTX2 files to measure them"
removed_when = "it becomes a gate under formats/web/tests"

[[entry_point]]
file = "formats/web/examples/ktx2_compare.rs"
what = "reads a format itself"
reason = "an audit tool comparing written KTX2 files"
removed_when = "it becomes a gate under formats/web/tests"

[[entry_point]]
file = "formats/web/examples/synthetic_tiles.rs"
what = "queries or edits world components"
reason = "builds a synthetic world to demonstrate the writer"
removed_when = "the synthetic world comes from a library fixture function"

# ---- passes registered, lowerings run as passes ----

[[pass]]
file = "toolkit/image/src/texture.rs"
what = "pass load-textures is not registered"
reason = "a loader written as a pass; loading is a reader's load step"
removed_when = "texture loading is a reader function, not a pass"

[[pass]]
file = "worlds/fromsoft/src/rigid.rs"
what = "pass fromsoft-apply-rigid-skinning is not registered"
reason = "the area reader applies skinning itself, so nothing runs the pass"
removed_when = "the reader keeps bone-space geometry and worlds/fromsoft registers the pass"

[[pass]]
file = "worlds/fromsoft/src/sekiro/normals.rs"
what = "lower returns a PassLog but no pass of worlds/fromsoft runs it"
reason = "consumer normal conversion is a function drivers call"
removed_when = "it runs as a declared pass"

[[pass]]
file = "worlds/fromsoft/src/sekiro/pbr.rs"
what = "lower returns a PassLog but no pass of worlds/fromsoft runs it"
reason = "Sekiro material lowering is a function, not yet a pass"
removed_when = "it runs as a declared pass"

[[pass]]
file = "worlds/unity/src/drawn.rs"
what = "pass unity-drawn is not registered"
reason = "worlds/unity has no register() yet"
removed_when = "worlds/unity exports register()"

[[pass]]
file = "worlds/unity/src/lower.rs"
what = "pass lower-unity-pbr is not registered"
reason = "worlds/unity has no register() yet"
removed_when = "worlds/unity exports register()"

[[pass]]
file = "worlds/unity/src/lower_collision.rs"
what = "pass lower-unity-collision is not registered"
reason = "worlds/unity has no register() yet"
removed_when = "worlds/unity exports register()"

[[pass]]
file = "worlds/unity/src/lower_lights.rs"
what = "pass lower-unity-lights is not registered"
reason = "worlds/unity has no register() yet"
removed_when = "worlds/unity exports register()"

[[pass]]
file = "worlds/unity/src/lower_terrain.rs"
what = "pass lower-unity-terrain is not registered"
reason = "worlds/unity has no register() yet"
removed_when = "worlds/unity exports register()"

# ---- writers take the world read-only ----

[[writer]]
file = "worlds/reskate/src/interchange/assets.rs"
what = "prepare_assets takes &mut World"
reason = "writes prototype GLBs and texture PNGs, then points the world at them, before write"
removed_when = "write serializes in-memory meshes and textures itself"

