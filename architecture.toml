# ---- writers take the world read-only ----

[[writer]]
file = "worlds/reskate/src/interchange/assets.rs"
what = "prepare_assets takes &mut World"
reason = "writes prototype GLBs and texture PNGs, then points the world at them, before write"
removed_when = "write serializes in-memory meshes and textures itself"

