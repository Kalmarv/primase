# Breaks of the role and layer rules (CONTRIBUTING.md, "Roles", "Layout"), checked by cli/tests/architecture.rs.
#
# Readers read, writers write, and everything listed here is a break to remove: each gives its reason and what
# removes it (`removed_when`). The test fails on a violation not listed here, on an entry that no longer occurs, and on
# any entry it hasn't seen before (`breaks_only_go`): fixing a violation means deleting its entry, never adding one.
# Disk access is a rule by crate role, not a list: only `exception` I/O is listed. `parse_crate` is an opt-in to a
# stricter rule, not a break.

# ---- crate dependencies ----

[[dependency]]
from = "worlds/reskate"
to = "formats/gltf"
section = "dependencies"
reason = "the interchange loads and writes prototype GLBs, and the post-compile step re-reads the map's"
removed_when = "the post-compile step takes the map's meshes in memory, and GLB encoding is a toolkit mechanism"

# ---- game, engine and destination names: none in core, toolkit and formats; a worlds crate only its own ----

[[name]]
crate = "toolkit/hash"
word = "fromsoft"
reason = "fromsoft_path, one game's path hash framing"
removed_when = "it moves into worlds/fromsoft, its only user"

[[name]]
crate = "toolkit/hash"
word = "forza"
reason = "forza_string, a hash with no user yet"
removed_when = "it moves into the Forza reader when one exists, or is deleted"

# ---- composition without data logic (examples, bins, cli) ----

[[entry_point]]
file = "cli/examples/scene_to_tiles.rs"
what = "queries or edits world components"
reason = "turns skate.* markers and grind curves into viewer items, and measures placements for the spanning rule"
removed_when = "primase convert replaces the example (the rule moves into primase-web, the lowering into a pass)"

[[entry_point]]
file = "cli/examples/scene_to_tiles.rs"
what = "runs a pass outside the pass manager"
reason = "runs lower-skate-pbr and lower-skate-lights directly"
removed_when = "primase convert replaces the example"

[[entry_point]]
file = "formats/web/examples/ktx2_audit.rs"
what = "reads a format itself"
reason = "an audit tool decoding written KTX2 files to measure them"
removed_when = "it becomes a gate under formats/web/tests"

[[entry_point]]
file = "formats/web/examples/ktx2_compare.rs"
what = "reads a format itself"
reason = "an audit tool comparing written KTX2 files"
removed_when = "it becomes a gate under formats/web/tests"

[[entry_point]]
file = "formats/web/examples/synthetic_tiles.rs"
what = "queries or edits world components"
reason = "builds a synthetic world to demonstrate the writer"
removed_when = "the synthetic world comes from a library fixture function"

