# Copy to an ignored primase-data.toml, then set PRIMASE_DATA to its absolute path.
# These are placeholders only. Keep private files outside the repository or under
# the ignored primase-data.toml / primase-data.*.toml names; never commit real paths.
# Every section and key is optional: a test whose input is not configured skips.
# The keys are CONTRIBUTING.md's real-data tables; an unknown one is an error.

[installs]
sekiro = 'D:/placeholder/games/Sekiro'
sledding = 'D:/placeholder/games/Sledding Game'

[keys]
gta = 'D:/placeholder/keys/gta'

[tools]
unity_tpk = 'D:/placeholder/tools/typetrees.tpk'

[oracles]
# <root>/<set>/<game>/<file>: oracles.codewalker.gta/listing.jsonl is <root>/codewalker/gta/listing.jsonl
root = 'D:/placeholder/oracles'

[scratch]
root = 'D:/placeholder/scratch'

[run]
# 'gate': every input the landing gate must have fails when missing; 'all': every input
require = 'gate'
# how much the heavy tests cover: 'smoke' (a sample, by default) or 'full' (the overnight gate)
gate = 'smoke'
# the smoke sample's seed: unset, the day's, so coverage accumulates; set it to rerun one sample exactly
# seed = '20384'
# the threads a heavy real-data test's work may use (the bakes' core.threads): unset, one, as light as the serial
# run; its results are the same on any count
# threads = '4'
