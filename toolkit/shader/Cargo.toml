[package]
name = "primase-shader"
description = "The shader program every bytecode lifts into: interface, validation, builder, WGSL writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-core.workspace = true
thiserror.workspace = true
naga.workspace = true
sha2.workspace = true

[dev-dependencies]
# The lifters, to run each fixture of tests/flow.rs through both bytecodes (a dev-dependency cycle cargo allows).
primase-dxbc.workspace = true
primase-dxil.workspace = true
# naga's WGSL front end, to read a writer's text back (tests/wgsl_for.rs)
naga = { workspace = true, features = ["wgsl-in"] }

[lints]
workspace = true
