# cargo-nextest runs every test as its own process, all binaries at once, where `cargo test` runs one binary after
# another: a real-data suite spends most of its time in a few single-threaded binaries, so it finishes in about the time
# of its longest tests instead of the sum of them all. `cargo nextest run` does not run doctests: `cargo test --doc`.

[profile.default]
# The slots double as a memory budget: a light test takes one, a test that holds gigabytes of an install takes one per
# gigabyte of its peak (the overrides below), so the tests running at once hold about 20 GB at most. Unweighted, the
# real-data gate on a 32 GB desktop ran out of memory: a decoder's buffer reservation was refused (Compression(Limit)).
test-threads = 20
# a real-data census can take minutes: report it as slow after one, never kill it for time
slow-timeout = { period = "60s" }
# every failure is printed at the end as well as where it happened, so a long run's failures are easy to find
failure-output = "immediate-final"
fail-fast = false

# Peak private bytes (committed memory) of each binary's test processes in the real-data gate ([run] threads = '4', no
# other heavy work on the machine), rounded up to whole GB. A working set is not the measure: under memory pressure the
# system trims it to a fraction of what the test commits. Remeasure when a heavy test changes.

[[profile.default.overrides]]
filter = "binary(effect_lights_census)"
threads-required = 17

[[profile.default.overrides]]
filter = "binary(area_reader) | binary(normal_basis)"
threads-required = 12

[[profile.default.overrides]]
filter = "binary(f_collision) | binary(hit_class_census)"
threads-required = 10

[[profile.default.overrides]]
filter = """
binary(grass_census) | binary(sekiro_scene) | binary(elden_area) | binary(elden_binding)
| binary(shader_bundles)
"""
threads-required = 9

[[profile.default.overrides]]
filter = "binary(baked_area) | binary(material_class_census) | binary(shadow_census) | binary(layer_bake_digest)"
threads-required = 6

[[profile.default.overrides]]
filter = "binary(interchange_real_data)"
threads-required = 5

[[profile.default.overrides]]
filter = """
binary(census) | binary(scene_disc) | binary(npc_outfits) | binary(character_census) | binary(elden_character)
| binary(elden_character_animation) | binary(speedtree)
"""
threads-required = 2
