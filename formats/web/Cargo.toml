[features]
default = []
ktx2 = ["dep:basisu_c_sys", "dep:primase-image"]

[dependencies]
basisu_c_sys = { workspace = true, optional = true }
primase-image = { workspace = true, optional = true }
sha2.workspace = true
meshopt.workspace = true
primase-core.workspace = true
primase-meshops.workspace = true
primase-gltf.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
basisu.workspace = true
primase-image.workspace = true
primase-skate-scene.workspace = true
sha2.workspace = true

[lints]
workspace = true

[[example]]
name = "synthetic_tiles"
required-features = ["ktx2"]
