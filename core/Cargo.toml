[package]
name = "primase-core"
description = "primase core: the world store, core components, frames, the pass manager and gates"
keywords = ["gamedev", "3d", "world", "ecs", "reverse-engineering"]
categories = ["game-development", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
half.workspace = true
iridia-analysis.workspace = true
iridia-dxbc.workspace = true
iridia-dxil.workspace = true
iridia-exec-ir.workspace = true
iridia-interface.workspace = true
iridia-ir.workspace = true
iridia-passes.workspace = true
primase-foundations.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# naga's WGSL front end, to read the surface's WGSL back and validate it (tests/surface_wgsl.rs)
naga = { workspace = true, features = ["wgsl-in"] }
# a GLSL fixture lifted to a program, for the shader specialisation tests
iridia-mojo.workspace = true
# the executor, to run a lifted fixture beside what is read of it (tests/blend.rs)
iridia-exec.workspace = true

[lints]
workspace = true
