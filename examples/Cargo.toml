[package]
name = "primase-examples"
description = "Programs showing primase used as a library (the README quotes them); no library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# the web writer's KTX2 encoding (the native Basis encoder), for sekiro_ktx2_tiles
ktx2 = ["primase-web/ktx2"]

[dev-dependencies]
primase-core.workspace = true
primase-foundations = { workspace = true, features = ["compress"] }
primase-fromsoft.workspace = true
primase-image.workspace = true
primase-reskate.workspace = true
primase-gltf.workspace = true
primase-web.workspace = true

[lints]
workspace = true

[[example]]
name = "sekiro_ktx2_tiles"
required-features = ["ktx2"]
