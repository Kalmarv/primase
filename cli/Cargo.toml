[package]
name = "primase-cli"
description = "primase command line: thin compositions of readers, passes and writers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# KTX2 textures in web tiles (`convert --to web --ktx2`); builds the Basis Universal encoder.
ktx2 = ["primase-web/ktx2", "dep:primase-cache"]

[dependencies]
primase-core.workspace = true
primase-fromsoft.workspace = true
primase-cache = { workspace = true, optional = true }
primase-gta.workspace = true
primase-image.workspace = true
primase-meshops.workspace = true
primase-reskate.workspace = true
primase-unity.workspace = true
primase-web.workspace = true

[dev-dependencies]
toml.workspace = true
primase-compress.workspace = true
primase-gltf.workspace = true
meshopt.workspace = true
serde_json.workspace = true
sha2.workspace = true
primase-testdata.workspace = true

[lints]
workspace = true

[[bin]]
name = "primase"
path = "src/main.rs"
