[workspace]
resolver = "3"
members = [
    "core",
    "toolkit/testdata",
    "repos/primase-bytes",
    "toolkit/texcodec",
    "toolkit/dds",
    "toolkit/image",
    "repos/primase-vertex",
    "toolkit/meshops",
    "toolkit/animation",
    "toolkit/lighting",
    "repos/primase-compress",
    "toolkit/glb",
    "repos/primase-hash",
    "toolkit/exactsum",
    "repos/dx/dxcontainer",
    "repos/dx/rsx-reader",
    "toolkit/havok",
    "toolkit/morpheme",
    "repos/lua51-bytecode",
    "toolkit/dxbc",
    "repos/iridia/iridia-d3d9",
    "repos/iridia/iridia",
    "repos/iridia/iridia-exec",
    "toolkit/dxil",
    "repos/iridia/iridia-mojo",
    "toolkit/cache",
    "formats/gltf",
    "formats/web",
    "checks",
    "examples",
    "worlds/fromsoft",
    "worlds/reskate",
    "worlds/unity",
    "worlds/skatebird",
    "worlds/stuntboost",
    "worlds/shred",
    "worlds/frostbite",
    "worlds/gta",
    "worlds/monogame",
    "worlds/anvil",
    "worlds/shaunwhite",
]
# the oozextract fork: upstream's sources and lints, not one of our crates (README there)
exclude = ["repos/primase-oozextract"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/kalmarv/primase"
publish = false

# Every third-party crate is pinned here, default features off, and used through `workspace = true`.
# Adding one: see CONTRIBUTING.md "Dependencies".
[workspace.dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
basisu_c_sys = { version = "=0.9.1", default-features = false, features = ["std", "encoder", "extra", "transcode_default"] }
basisu = { version = "=0.1.0", default-features = false, features = ["std", "zstd"] }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
meshopt = { version = "=0.6.2", default-features = false }
aes = { version = "=0.9.3", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
primase-fromsoft = { path = "worlds/fromsoft" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
ruzstd = { version = "=0.7.3", default-features = false, features = ["std", "hash"] }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
oozextract = { package = "primase-oozextract", version = "=0.5.6", path = "repos/primase-oozextract", default-features = false, features = ["verbose_errors"] }
primase-core = { path = "core" }
primase-testdata = { path = "toolkit/testdata" }
primase-bytes = { path = "repos/primase-bytes" }
primase-texcodec = { path = "toolkit/texcodec" }
primase-dds = { path = "toolkit/dds" }
primase-image = { path = "toolkit/image" }
primase-vertex = { path = "repos/primase-vertex" }
primase-meshops = { path = "toolkit/meshops" }
primase-animation = { path = "toolkit/animation" }
primase-lighting = { path = "toolkit/lighting" }
primase-compress = { path = "repos/primase-compress" }
primase-glb = { path = "toolkit/glb" }
primase-hash = { path = "repos/primase-hash" }
primase-exactsum = { path = "toolkit/exactsum" }
dxcontainer = { path = "repos/dx/dxcontainer" }
rsx-reader = { path = "repos/dx/rsx-reader" }
primase-cache = { path = "toolkit/cache" }
primase-havok = { path = "toolkit/havok" }
primase-morpheme = { path = "toolkit/morpheme" }
lua51-bytecode = { path = "repos/lua51-bytecode" }
primase-dxbc = { path = "toolkit/dxbc" }
iridia-d3d9 = { path = "repos/iridia/iridia-d3d9" }
iridia = { path = "repos/iridia/iridia" }
iridia-exec = { path = "repos/iridia/iridia-exec" }
primase-dxil = { path = "toolkit/dxil" }
iridia-mojo = { path = "repos/iridia/iridia-mojo" }
primase-frostbite = { path = "worlds/frostbite" }
primase-gltf = { path = "formats/gltf" }
primase-web = { path = "formats/web" }
primase-reskate = { path = "worlds/reskate" }
primase-unity = { path = "worlds/unity" }
primase-skatebird = { path = "worlds/skatebird" }
primase-stuntboost = { path = "worlds/stuntboost" }
primase-gta = { path = "worlds/gta" }
primase-monogame = { path = "worlds/monogame" }
primase-anvil = { path = "worlds/anvil" }
primase-shaunwhite = { path = "worlds/shaunwhite" }
primase-shred = { path = "worlds/shred" }

thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", default-features = false, features = ["derive"] }
half = { version = "=2.7.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-out"] }
# benches (CONTRIBUTING.md, "Priorities"): dev-dependencies only, without its plots and its rayon
criterion = { version = "=0.8.2", default-features = false }

png = { version = "=0.18.1", default-features = false }
# JPEG decoding (primase_image::read_jpeg): pure Rust, MIT OR Apache-2.0 OR Zlib. Without its `x86` and `neon` features it has
# no unsafe code (the SIMD paths are its only unsafe), and the integer scalar IDCT gives the same pixels on every machine.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
bcdec_rs = { version = "=0.2.0", default-features = false }
block_compression = { version = "=0.10.1", default-features = false, features = ["bc7"] }

# naga 30.0.1 plus three changes it lacks (branch naga-30.0.1-primase of github.com/Kalmarv/wgpu, from the v30.0.1 tag, nothing
# else): the WGSL writer writes ray queries, `Statement::ImageAtomic` has an optional result (the texel's previous value), and
# accepts `Exchange` on 32-bit images. Not yet proposed upstream.
[patch.crates-io]
naga = { git = "https://github.com/Kalmarv/wgpu", rev = "546ce02f49d9da8f7118b0a8257e210f3b7b1d02" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# CONTRIBUTING.md, Determinism: no HashMap/HashSet iteration on a path that reaches output. The lint sees `for` loops
# over a hash container or its `.iter()`, `.keys()`, `.values()`; not iterator chains (`.map(..)`, `.collect()`,
# `.extend(..)`), which review still has to catch.
iter_over_hash_type = "deny"
# Denied in each library crate's lib.rs, so tests and examples keep file access (clippy.toml lists them).
disallowed_methods = "allow"
disallowed_types = "allow"

# Debug info: line tables for our crates (backtraces keep file and line), none for dependencies. Full debug info
# made each agent's target directory ~90 GB, mostly Windows debug info in test binaries; turn it on locally when
# stepping through code in a debugger (CARGO_PROFILE_DEV_DEBUG=true). The test profile inherits both.
[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
