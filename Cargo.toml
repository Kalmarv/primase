[workspace]
resolver = "3"
members = [
    "core",
    "toolkit/texcodec",
    "toolkit/dds",
    "toolkit/image",
    "toolkit/meshops",
    "toolkit/animation",
    "toolkit/lighting",
    "toolkit/glb",
    "toolkit/exactsum",
    "toolkit/havok",
    "toolkit/cache",
    "formats/gltf",
    "checks",
    "examples",
    "worlds/fromsoft",
    "worlds/reskate",
    "worlds/unity",
    "worlds/skatebird",
    "worlds/peak",
    "worlds/stuntboost",
    "worlds/shred",
    "worlds/frostbite",
    "worlds/gta",
    "worlds/monogame",
    "worlds/anvil",
    "worlds/shaunwhite",
    "worlds/trackmania",
    "worlds/forzatech",
    "worlds/blender",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/kalmarv/primase"
publish = true

# Every third-party crate is pinned here, default features off, and used through `workspace = true`.
# Adding one: see CONTRIBUTING.md "Dependencies".
[workspace.dependencies]
primase-foundations = "0.3.1"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
aes = { version = "=0.9.3", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
fromsoft-formats = { version = "0.15.0" }
primase-fromsoft = { version = "0.2.0", path = "worlds/fromsoft" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
ruzstd = { version = "=0.7.3", default-features = false, features = ["std", "hash"] }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
oozextract = { version = "=0.5.7", default-features = false, features = ["verbose_errors"] }
primase-core = { version = "0.2.0", path = "core" }
primase-testdata = "0.1.15"
primase-texcodec = { version = "0.2.0", path = "toolkit/texcodec" }
primase-dds = { version = "0.2.0", path = "toolkit/dds" }
primase-image = { version = "0.2.0", path = "toolkit/image" }
primase-meshops = { version = "0.2.0", path = "toolkit/meshops" }
primase-animation = { version = "0.2.0", path = "toolkit/animation" }
primase-lighting = { version = "0.2.0", path = "toolkit/lighting" }
primase-glb = { version = "0.2.0", path = "toolkit/glb" }
primase-exactsum = { version = "0.2.0", path = "toolkit/exactsum" }
dxcontainer = { version = "0.12.0" }
rsx-reader = { version = "0.12.0" }
primase-cache = { version = "0.2.0", path = "toolkit/cache" }
havok-cloth = { version = "0.3.0" }
havok-formats = { version = "0.9.0" }
primase-havok = { version = "0.2.0", path = "toolkit/havok" }
morpheme-formats = { version = "0.1.1" }
rme-formats = { version = "0.5.0", git = "https://github.com/Kalmarv/rme-formats", rev = "8d71806b3da0bf6fd78267fceddb1dda5a98eb60" }
unity-formats = { version = "0.5.0" }
gbx-formats = { version = "0.1.0" }
monogame-formats = { version = "0.1.1" }
lua51-bytecode = { version = "0.2.0" }
dxbc-reader = { version = "0.12.0" }
iridia-dxbc = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-d3d9 = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-interface = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-exec = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-dxil = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-mojo = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-ir = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-passes = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-analysis = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-naga = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-d3d9-ir = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
iridia-exec-ir = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "da3ebb4e894de346c45cf71f89bddbe904bd453a" }
primase-frostbite = { version = "0.2.0", path = "worlds/frostbite" }
primase-gltf = { version = "0.2.0", path = "formats/gltf" }
primase-reskate = { version = "0.2.0", path = "worlds/reskate" }
primase-blender = { version = "0.2.0", path = "worlds/blender" }
primase-unity = { version = "0.2.0", path = "worlds/unity" }
primase-skatebird = { version = "0.2.0", path = "worlds/skatebird" }
primase-peak = { version = "0.2.0", path = "worlds/peak" }
primase-stuntboost = { version = "0.2.0", path = "worlds/stuntboost" }
primase-gta = { version = "0.2.0", path = "worlds/gta" }
primase-monogame = { version = "0.2.0", path = "worlds/monogame" }
primase-anvil = { version = "0.2.0", path = "worlds/anvil" }
primase-shaunwhite = { version = "0.2.0", path = "worlds/shaunwhite" }
primase-shred = { version = "0.2.0", path = "worlds/shred" }
primase-trackmania = { version = "0.2.0", path = "worlds/trackmania" }
primase-forzatech = { version = "0.2.0", path = "worlds/forzatech" }
anvil-formats = { version = "0.2.1", git = "https://github.com/Kalmarv/anvil-formats", rev = "02dd926c7e388cad2de4414dcd7c32c416faa536" }
dxil-reader = { version = "0.12.0" }
frostbite-formats = { version = "0.3.0" }
forzatech-formats = { version = "0.1.0" }
rage-engine-formats = { version = "0.3.0" }

thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", default-features = false, features = ["derive"] }
half = { version = "=2.7.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
# naga 30.0.1 plus three changes it lacks (the WGSL writer writes ray queries; `Statement::ImageAtomic` has an optional
# result; `Exchange` on 32-bit images): the primase-naga fork, its README says what and why
naga = { version = "30.0.1", package = "primase-naga", default-features = false, features = ["wgsl-out"] }
# benches (CONTRIBUTING.md, "Priorities"): dev-dependencies only, without its plots and its rayon
criterion = { version = "=0.8.2", default-features = false }

png = { version = "=0.18.1", default-features = false }
# JPEG decoding (primase_image::read_jpeg): pure Rust, MIT OR Apache-2.0 OR Zlib. Without its `x86` and `neon` features it has
# no unsafe code (the SIMD paths are its only unsafe), and the integer scalar IDCT gives the same pixels on every machine.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
bcdec_rs = { version = "=0.2.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# CONTRIBUTING.md, Determinism: no HashMap/HashSet iteration on a path that reaches output. The lint sees `for` loops
# over a hash container or its `.iter()`, `.keys()`, `.values()`; not iterator chains (`.map(..)`, `.collect()`,
# `.extend(..)`), which review still has to catch.
iter_over_hash_type = "deny"
# Denied in each library crate's lib.rs, so tests and examples keep file access (clippy.toml lists them).
disallowed_methods = "allow"
disallowed_types = "allow"

# Debug info: line tables for our crates (backtraces keep file and line), none for dependencies. Full debug info
# made each agent's target directory ~90 GB, mostly Windows debug info in test binaries; turn it on locally when
# stepping through code in a debugger (CARGO_PROFILE_DEV_DEBUG=true). The test profile inherits both.
[profile.dev]
debug = "line-tables-only"

# The test profile is dev's: our crates unoptimised, their dependencies at opt-level 2 (below). The unit tests run as
# fast unoptimised and build 114 s sooner; a real-data test needs `--cargo-profile gate`.

[profile.dev.package."*"]
opt-level = 2
debug = false

# The real-data suite's profile (`cargo nextest run --cargo-profile gate`): release speed with debug assertions, so the
# checks that are on in the test suites and off in release builds run on the installs' data too. Without them a pass
# that adds a component it does not declare passes every real-data test (`PassManager::pass_checks` follows
# `debug_assertions`), and only a debug run of the same test names it.
[profile.gate]
inherits = "release"
debug-assertions = true
