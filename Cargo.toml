[workspace]
resolver = "3"
members = [
    "core",
    "toolkit/texcodec",
    "toolkit/dds",
    "toolkit/image",
    "toolkit/meshops",
    "toolkit/animation",
    "toolkit/lighting",
    "toolkit/glb",
    "toolkit/exactsum",
    "toolkit/havok",
    "toolkit/cache",
    "formats/gltf",
    "formats/web",
    "checks",
    "examples",
    "worlds/fromsoft",
    "worlds/reskate",
    "worlds/unity",
    "worlds/skatebird",
    "worlds/peak",
    "worlds/stuntboost",
    "worlds/shred",
    "worlds/frostbite",
    "worlds/gta",
    "worlds/monogame",
    "worlds/anvil",
    "worlds/shaunwhite",
    "worlds/trackmania",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/kalmarv/primase"
publish = false

# Every third-party crate is pinned here, default features off, and used through `workspace = true`.
# Adding one: see CONTRIBUTING.md "Dependencies".
[workspace.dependencies]
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e" }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
basisu_c_sys = { version = "=0.9.1", default-features = false, features = ["std", "encoder", "extra", "transcode_default"] }
basisu = { version = "=0.1.0", default-features = false, features = ["std", "zstd"] }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
meshopt = { version = "=0.6.2", default-features = false }
aes = { version = "=0.9.3", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
fromsoft-formats = { git = "https://github.com/Kalmarv/fromsoft-formats", rev = "d177148f5809270493e1b8ccdce19422c3f6429c", version = "0.14.0" }
primase-fromsoft = { path = "worlds/fromsoft" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
ruzstd = { version = "=0.7.3", default-features = false, features = ["std", "hash"] }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
oozextract = { version = "=0.5.7", default-features = false, features = ["verbose_errors"] }
primase-core = { path = "core" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "eb199df6f315faf37732ea648413ae044be2128f" }
primase-texcodec = { path = "toolkit/texcodec" }
primase-dds = { path = "toolkit/dds" }
primase-image = { path = "toolkit/image" }
primase-meshops = { path = "toolkit/meshops" }
primase-animation = { path = "toolkit/animation" }
primase-lighting = { path = "toolkit/lighting" }
primase-glb = { path = "toolkit/glb" }
primase-exactsum = { path = "toolkit/exactsum" }
dxcontainer = { git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
rsx-reader = { git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
primase-cache = { path = "toolkit/cache" }
havok-cloth = { git = "https://github.com/Kalmarv/havok-cloth", rev = "f8214d488298828abf7fe8ca664717ee2687b938" }
havok-formats = { git = "https://github.com/Kalmarv/havok-formats", rev = "f681dd1375a6d05666cc998c581defe47d326063" }
primase-havok = { path = "toolkit/havok" }
morpheme-formats = { git = "https://github.com/Kalmarv/morpheme-formats", rev = "40467a65f41d052534d90c18d980ef3329967de7" }
rme-formats = { git = "https://github.com/Kalmarv/rme-formats", rev = "6d51f9f02ba40ae7770ba57fce0346669a6b8f49" }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "72c057749e7aae480d6c6afc117e2f46d1715f11", version = "0.2.2" }
gbx-formats = { git = "https://github.com/Kalmarv/gbx-formats", rev = "a291955c471f35c1652ec919736d8aff7a62b5cf" }
monogame-formats = { git = "https://github.com/Kalmarv/monogame-formats", rev = "05cc99b09f9d9b897ce1360ceffdbab5222ecc08" }
lua51-bytecode = { git = "https://github.com/Kalmarv/lua51-bytecode", rev = "cfa3a7001c3f8d240a2360b7598609d420d99243" }
dxbc-reader = { git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
iridia-dxbc = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia-d3d9 = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia-interface = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia-exec = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia-dxil = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
iridia-mojo = { git = "https://github.com/Kalmarv/iridia", rev = "4f0c1dcd0723ca9ca47a14dab9222774daa90545" }
primase-frostbite = { path = "worlds/frostbite" }
primase-gltf = { path = "formats/gltf" }
primase-web = { path = "formats/web" }
primase-reskate = { path = "worlds/reskate" }
primase-unity = { path = "worlds/unity" }
primase-skatebird = { path = "worlds/skatebird" }
primase-peak = { path = "worlds/peak" }
primase-stuntboost = { path = "worlds/stuntboost" }
primase-gta = { path = "worlds/gta" }
primase-monogame = { path = "worlds/monogame" }
primase-anvil = { path = "worlds/anvil" }
primase-shaunwhite = { path = "worlds/shaunwhite" }
primase-shred = { path = "worlds/shred" }
primase-trackmania = { path = "worlds/trackmania" }
anvil-formats = { git = "https://github.com/Kalmarv/anvil-formats", rev = "9504711959f9443aa95ae1d2d80686238528e4a4" }
dxil-reader = { git = "https://github.com/Kalmarv/dx", rev = "c32a3689c6bd26a0ee0777664091f4e04843927e" }
frostbite-formats = { git = "https://github.com/Kalmarv/frostbite-formats", rev = "413a70b3f90c0c8bbb7377df09d1c3edcb743a86" }
rage-engine-formats = { git = "https://github.com/Kalmarv/rage-engine-formats", rev = "6866413a19f4c25dc9270fe8bc0849518c220ca4" }

thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", default-features = false, features = ["derive"] }
half = { version = "=2.7.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
# naga 30.0.1 plus three changes it lacks (the WGSL writer writes ray queries; `Statement::ImageAtomic` has an optional
# result; `Exchange` on 32-bit images): the primase-naga fork, its README says what and why
naga = { package = "primase-naga", git = "https://github.com/Kalmarv/primase-naga", rev = "8e6519c3eac6f08519c61c40cb6516ea95f6dde9", default-features = false, features = ["wgsl-out"] }
# benches (CONTRIBUTING.md, "Priorities"): dev-dependencies only, without its plots and its rayon
criterion = { version = "=0.8.2", default-features = false }

png = { version = "=0.18.1", default-features = false }
# JPEG decoding (primase_image::read_jpeg): pure Rust, MIT OR Apache-2.0 OR Zlib. Without its `x86` and `neon` features it has
# no unsafe code (the SIMD paths are its only unsafe), and the integer scalar IDCT gives the same pixels on every machine.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
bcdec_rs = { version = "=0.2.0", default-features = false }
block_compression = { version = "=0.10.1", default-features = false, features = ["bc7"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# CONTRIBUTING.md, Determinism: no HashMap/HashSet iteration on a path that reaches output. The lint sees `for` loops
# over a hash container or its `.iter()`, `.keys()`, `.values()`; not iterator chains (`.map(..)`, `.collect()`,
# `.extend(..)`), which review still has to catch.
iter_over_hash_type = "deny"
# Denied in each library crate's lib.rs, so tests and examples keep file access (clippy.toml lists them).
disallowed_methods = "allow"
disallowed_types = "allow"

# Debug info: line tables for our crates (backtraces keep file and line), none for dependencies. Full debug info
# made each agent's target directory ~90 GB, mostly Windows debug info in test binaries; turn it on locally when
# stepping through code in a debugger (CARGO_PROFILE_DEV_DEBUG=true). The test profile inherits both.
[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

# The real-data suite's profile (`cargo nextest run --cargo-profile gate`): release speed with debug assertions, so the
# checks that are on in the test suites and off in release builds run on the installs' data too. Without them a pass
# that adds a component it does not declare passes every real-data test (`PassManager::pass_checks` follows
# `debug_assertions`), and only a debug run of the same test names it.
[profile.gate]
inherits = "release"
debug-assertions = true
