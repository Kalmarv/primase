[workspace]
resolver = "3"
members = [
    "core",
    "toolkit/texcodec",
    "toolkit/dds",
    "toolkit/image",
    "toolkit/meshops",
    "toolkit/animation",
    "toolkit/lighting",
    "toolkit/glb",
    "toolkit/exactsum",
    "toolkit/havok",
    "toolkit/cache",
    "formats/gltf",
    "checks",
    "examples",
    "worlds/fromsoft",
    "worlds/reskate",
    "worlds/unity",
    "worlds/skatebird",
    "worlds/peak",
    "worlds/stuntboost",
    "worlds/shred",
    "worlds/frostbite",
    "worlds/gta",
    "worlds/monogame",
    "worlds/anvil",
    "worlds/shaunwhite",
    "worlds/trackmania",
    "worlds/forzatech",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/kalmarv/primase"
publish = false

# Every third-party crate is pinned here, default features off, and used through `workspace = true`.
# Adding one: see CONTRIBUTING.md "Dependencies".
[workspace.dependencies]
primase-foundations = "0.3.1"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
encoding_rs = { version = "=0.8.42", default-features = false, features = ["alloc"] }
aes = { version = "=0.9.3", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }
fromsoft-formats = { git = "https://github.com/Kalmarv/fromsoft-formats", rev = "b4e48238d2bd5f8337e8f13633c94a6706e13f24", version = "0.14.0" }
primase-fromsoft = { path = "worlds/fromsoft" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quantydb-sqlite = { version = "=0.4.0", default-features = false }
ruzstd = { version = "=0.7.3", default-features = false, features = ["std", "hash"] }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
oozextract = { version = "=0.5.7", default-features = false, features = ["verbose_errors"] }
primase-core = { path = "core" }
primase-testdata = { git = "https://github.com/Kalmarv/primase-testdata", rev = "58da6ba4850893424278d1331ae669c4e75b4f6e" }
primase-texcodec = { path = "toolkit/texcodec" }
primase-dds = { path = "toolkit/dds" }
primase-image = { path = "toolkit/image" }
primase-meshops = { path = "toolkit/meshops" }
primase-animation = { path = "toolkit/animation" }
primase-lighting = { path = "toolkit/lighting" }
primase-glb = { path = "toolkit/glb" }
primase-exactsum = { path = "toolkit/exactsum" }
dxcontainer = { git = "https://github.com/Kalmarv/dx", rev = "39883bd084ad1db1f66416f41b25cf2529f9eec1" }
rsx-reader = { git = "https://github.com/Kalmarv/dx", rev = "39883bd084ad1db1f66416f41b25cf2529f9eec1" }
primase-cache = { path = "toolkit/cache" }
havok-cloth = { git = "https://github.com/Kalmarv/havok-cloth", rev = "c68c5cba8560f76147f230dd672d2a5c63c82c84" }
havok-formats = { git = "https://github.com/Kalmarv/havok-formats", rev = "eb2aba273217c2ece6e5a59981ddfd6b41a02497" }
primase-havok = { path = "toolkit/havok" }
morpheme-formats = { git = "https://github.com/Kalmarv/morpheme-formats", rev = "187d8827c679eca818707036e8678657ad029628" }
rme-formats = { git = "https://github.com/Kalmarv/rme-formats", rev = "82e69614412274fdd78fd4bc45f7d89def75a045" }
unity-formats = { git = "https://github.com/Kalmarv/unity-formats", rev = "3b5c8561a4576be65d84a42f105664ba290a9fe5", version = "0.3.1" }
gbx-formats = { git = "https://github.com/Kalmarv/gbx-formats", rev = "b0cfa1132fce4285b3125398d79e9749bef9bc19" }
monogame-formats = { git = "https://github.com/Kalmarv/monogame-formats", rev = "7e8091ef9881b91815403154f14fb6eec2b4cfc9" }
lua51-bytecode = { git = "https://github.com/Kalmarv/lua51-bytecode", rev = "1ba5d089f5a1ba4061e3edb77b80ac93d1802300" }
dxbc-reader = { git = "https://github.com/Kalmarv/dx", rev = "39883bd084ad1db1f66416f41b25cf2529f9eec1" }
iridia-dxbc = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia-d3d9 = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia-interface = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia-exec = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia-dxil = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
iridia-mojo = { git = "https://github.com/Kalmarv/iridia", rev = "bf29905ec1d75d843b795ea5dea1db529ae71e5c" }
primase-frostbite = { path = "worlds/frostbite" }
primase-gltf = { path = "formats/gltf" }
primase-reskate = { path = "worlds/reskate" }
primase-unity = { path = "worlds/unity" }
primase-skatebird = { path = "worlds/skatebird" }
primase-peak = { path = "worlds/peak" }
primase-stuntboost = { path = "worlds/stuntboost" }
primase-gta = { path = "worlds/gta" }
primase-monogame = { path = "worlds/monogame" }
primase-anvil = { path = "worlds/anvil" }
primase-shaunwhite = { path = "worlds/shaunwhite" }
primase-shred = { path = "worlds/shred" }
primase-trackmania = { path = "worlds/trackmania" }
primase-forzatech = { path = "worlds/forzatech" }
anvil-formats = { git = "https://github.com/Kalmarv/anvil-formats", rev = "77b898230d491dcdfc8c8fcdb858801132e4ca40" }
dxil-reader = { git = "https://github.com/Kalmarv/dx", rev = "39883bd084ad1db1f66416f41b25cf2529f9eec1" }
frostbite-formats = { git = "https://github.com/Kalmarv/frostbite-formats", rev = "c362662975d4cc57a1b4e836c7f1e96740bc8a5a" }
forzatech-formats = { git = "https://github.com/Kalmarv/forzatech-formats", rev = "ee318b957c97127b1c5eef1f8af6983c39038208", version = "0.1.0" }
rage-engine-formats = { git = "https://github.com/Kalmarv/rage-engine-formats", rev = "b3705f7bb24c2151ae7df827f6cf9dae8be1d703" }

thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", default-features = false, features = ["derive"] }
half = { version = "=2.7.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
# naga 30.0.1 plus three changes it lacks (the WGSL writer writes ray queries; `Statement::ImageAtomic` has an optional
# result; `Exchange` on 32-bit images): the primase-naga fork, its README says what and why
naga = { package = "primase-naga", git = "https://github.com/Kalmarv/primase-naga", rev = "8e6519c3eac6f08519c61c40cb6516ea95f6dde9", default-features = false, features = ["wgsl-out"] }
# benches (CONTRIBUTING.md, "Priorities"): dev-dependencies only, without its plots and its rayon
criterion = { version = "=0.8.2", default-features = false }

png = { version = "=0.18.1", default-features = false }
# JPEG decoding (primase_image::read_jpeg): pure Rust, MIT OR Apache-2.0 OR Zlib. Without its `x86` and `neon` features it has
# no unsafe code (the SIMD paths are its only unsafe), and the integer scalar IDCT gives the same pixels on every machine.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
bcdec_rs = { version = "=0.2.0", default-features = false }
block_compression = { version = "=0.10.1", default-features = false, features = ["bc7"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# CONTRIBUTING.md, Determinism: no HashMap/HashSet iteration on a path that reaches output. The lint sees `for` loops
# over a hash container or its `.iter()`, `.keys()`, `.values()`; not iterator chains (`.map(..)`, `.collect()`,
# `.extend(..)`), which review still has to catch.
iter_over_hash_type = "deny"
# Denied in each library crate's lib.rs, so tests and examples keep file access (clippy.toml lists them).
disallowed_methods = "allow"
disallowed_types = "allow"

# Debug info: line tables for our crates (backtraces keep file and line), none for dependencies. Full debug info
# made each agent's target directory ~90 GB, mostly Windows debug info in test binaries; turn it on locally when
# stepping through code in a debugger (CARGO_PROFILE_DEV_DEBUG=true). The test profile inherits both.
[profile.dev]
debug = "line-tables-only"

# The test profile is dev's: our crates unoptimised, their dependencies at opt-level 2 (below). The unit tests run as
# fast unoptimised and build 114 s sooner; a real-data test needs `--cargo-profile gate`.

[profile.dev.package."*"]
opt-level = 2
debug = false

# The real-data suite's profile (`cargo nextest run --cargo-profile gate`): release speed with debug assertions, so the
# checks that are on in the test suites and off in release builds run on the installs' data too. Without them a pass
# that adds a component it does not declare passes every real-data test (`PassManager::pass_checks` follows
# `debug_assertions`), and only a debug run of the same test names it.
[profile.gate]
inherits = "release"
debug-assertions = true
