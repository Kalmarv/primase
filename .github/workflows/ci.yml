name: ci
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # the unit tests, the architecture rules and the real-data declarations, as landing runs them (CONTRIBUTING.md,
      # Landing); the real-data tests themselves need the installs, which a runner does not have
      - run: cargo test --workspace --locked --lib --bins --test architecture --test real_data_inputs
