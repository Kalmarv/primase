[package]
name = "oozextract"
description = "Open source Kraken / Mermaid / Selkie / Leviathan / LZNA / Bitknit decompressor (primase's patched copy of oozextract 0.5.6)"
repository = "https://github.com/lvlvllvlvllvlvl/oozextract"
version = "0.5.6"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
bytemuck = "1.19.0"
bytes = "1.8.0"
futures = "0.3.31"
log = "0.4.22"
test-log = "0.2.16"
tokio = { version = "1.41.0", optional = true, features = ["io-util"] }
wide = "0.7.28"

[features]
x86_sse = []
async = []
tokio = ["async", "dep:tokio"]
verbose_errors = []

# the upstream sources name features (wasm) and cfgs (nightly) this copy does not carry
[lints.rust]
unexpected_cfgs = "allow"
